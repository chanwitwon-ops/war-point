<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รายละเอียดแมตช์ · war-point</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/util.js" defer></script>
  <script src="js/firebase-config.js"></script>
  <script type="module" src="js/firebase.js"></script>
  <script src="js/nav.js" defer></script>
  <script src="js/auth-guard.js" defer></script>
  <script src="js/tournament-demo-data.js" defer></script>
  <script src="js/tournament-match.js" defer></script>
</head>
<body>
  <div id="nav"></div>

  <div class="container">
    <div class="top-links">
      <a id="ลิงก์กลับผัง" href="tournament.html">← กลับไปผังทัวนาเมนต์</a>
    </div>

    <h1 id="หัวข้อแมตช์">รายละเอียดแมตช์</h1>
    <p class="subtitle" id="คำอธิบายแมตช์">Best of 3 ยก · ดูทีละเหตุการณ์จากบันทึกการต่อสู้</p>

    <div id="กล่องกำลังโหลด" class="card">
      <p>กำลังโหลด…</p>
    </div>

    <div id="กล่องไม่มีสิทธิ์" class="card hidden">
      <p>หน้านี้สำหรับครูเท่านั้น</p>
    </div>

    <div id="กล่องไม่พบ" class="card hidden">
      <p id="ข้อความไม่พบ"></p>
    </div>

    <div id="กล่องหลัก" class="hidden">
      <!-- ฝั่งทั้ง 2 + ค่าสเตตัส + HP (ค่า HP จะอัปเดตตามเหตุการณ์ที่เล่นถึง) -->
      <div class="card">
        <div id="กล่องฝ่าย" class="versus"></div>
        <p class="hint">ค่าสเตตัสและค่า HP เป็นค่าสมมติสำหรับเดโม ยังไม่ใช่ค่าทางการของสายพันธุ์</p>
      </div>

      <!-- ผลสรุปของแมตช์ (อ่านจาก battle log) -->
      <div class="card">
        <p class="section-title">ผลสรุป</p>
        <div id="กล่องผลสรุป"></div>
      </div>

      <!-- ภาพเคลื่อนไหว: ตอนนี้ js/tournament-match.js เติมข้อความแทนลงในกล่องนี้
           ในอนาคตให้ใส่ <video> ของสายพันธุ์แทนที่ (แก้เฉพาะฟังก์ชันวาดภาพเคลื่อนไหวใน JS)
           โดยโครงหน้าและปุ่มควบคุมด้านล่างไม่ต้องเปลี่ยน -->
      <div class="card">
        <p class="section-title">ภาพเคลื่อนไหว</p>
        <div id="ที่วางภาพเคลื่อนไหว" class="stage"></div>
        <p class="counter" id="ตัวนับเหตุการณ์"></p>
        <div class="btn-row playback">
          <button type="button" class="btn-ok" id="ปุ่มเล่น">▶ เล่น</button>
          <button type="button" class="btn-ghost" id="ปุ่มก้าวถัดไป">ก้าวถัดไป</button>
          <button type="button" class="btn-ghost" id="ปุ่มกลับไปต้น">กลับไปต้น</button>
        </div>
      </div>

      <!-- บันทึกเหตุการณ์แบบข้อความ (ตามลำดับ seq) -->
      <div class="card">
        <p class="section-title">บันทึกเหตุการณ์</p>
        <ol class="event-log" id="บันทึกเหตุการณ์"></ol>
      </div>
    </div>
  </div>
</body>
</html>
