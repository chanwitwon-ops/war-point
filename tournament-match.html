<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รายละเอียดแมตช์ · war-point</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pet-animation.css">
  <script src="js/util.js" defer></script>
  <script src="js/firebase-config.js"></script>
  <script type="module" src="js/firebase.js"></script>
  <script src="js/nav.js" defer></script>
  <script src="js/auth-guard.js" defer></script>
  <script src="js/pet-config.js" defer></script>
  <script src="js/combat-engine.js" defer></script>
  <script src="js/tournament-data.js" defer></script>
  <script src="js/pet-animation.js" defer></script>
  <script src="js/tournament-match.js" defer></script>
</head>
<body>
  <div id="nav"></div>

  <div class="container">
    <div class="top-links">
      <a id="ลิงก์กลับผัง" href="tournament.html">← กลับไปผังทัวนาเมนต์</a>
    </div>

    <h1 id="หัวข้อแมตช์">รายละเอียดแมตช์</h1>
    <p class="subtitle" id="คำอธิบายแมตช์">ดูการต่อสู้จากบันทึกที่คำนวณไว้แล้ว</p>

    <div id="กล่องกำลังโหลด" class="card">
      <p>กำลังโหลด…</p>
    </div>

    <div id="กล่องไม่พบ" class="card hidden">
      <p id="ข้อความไม่พบ"></p>
    </div>

    <div id="กล่องหลัก" class="hidden">
      <!-- ภาพเคลื่อนไหว: js/pet-animation.js วาดเวทีลงกล่องนี้ (คลิปอยู่ที่ assets/pets/<สายพันธุ์>/) -->
      <div class="card">
        <div id="ที่วางภาพเคลื่อนไหว" class="stage"></div>
        <p class="stage-headline" id="ข้อความใต้ภาพ"></p>
        <p class="counter" id="ตัวนับเหตุการณ์"></p>
        <div class="btn-row playback">
          <button type="button" class="btn-ok" id="ปุ่มเล่น">▶ เล่น</button>
          <button type="button" class="btn-ghost" id="ปุ่มก้าวถัดไป">ก้าวถัดไป</button>
          <button type="button" class="btn-ghost" id="ปุ่มกลับไปต้น">กลับไปต้น</button>
        </div>
      </div>

      <!-- ฝั่งทั้ง 2 + ค่าสเตตัส + HP (HP อัปเดตตามเหตุการณ์ที่เล่นถึง) -->
      <div class="card">
        <div id="กล่องฝ่าย" class="versus"></div>
        <p class="hint">ค่าสเตตัสคือของสัตว์เลี้ยงจริงของนักเรียน ณ ตอนที่ครูสร้างทัวนาเมนต์</p>
      </div>

      <div class="card">
        <p class="section-title">ผลสรุป</p>
        <div id="กล่องผลสรุป"></div>
      </div>

      <div class="card">
        <p class="section-title">บันทึกเหตุการณ์</p>
        <ol class="event-log" id="บันทึกเหตุการณ์"></ol>
      </div>
    </div>
  </div>
</body>
</html>
