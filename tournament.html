<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ทัวนาเมนต์ · war-point</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/util.js" defer></script>
  <script src="js/firebase-config.js"></script>
  <script type="module" src="js/firebase.js"></script>
  <script src="js/nav.js" defer></script>
  <script src="js/auth-guard.js" defer></script>
  <script src="js/pet-config.js" defer></script>
  <script src="js/pet-data.js" defer></script>
  <script src="js/combat-engine.js" defer></script>
  <script src="js/tournament-data.js" defer></script>
  <script src="js/leaderboard-data.js" defer></script>
  <script src="js/tournament.js" defer></script>
</head>
<body>
  <div id="nav"></div>

  <div class="container">
    <h1>ทัวนาเมนต์แพ้คัดออก</h1>
    <p class="subtitle">ผลทุกแมตช์คำนวณจากค่าสเตตัสของสัตว์เลี้ยงจริง ไม่ได้กำหนดผลไว้ล่วงหน้า · ครูเลือกนักเรียนกี่คนก็ได้ ระบบสุ่มจับคู่ แพ้คัดออกจนได้แชมป์</p>

    <div id="กล่องกำลังโหลด" class="card">
      <p>กำลังโหลด…</p>
    </div>

    <!-- js/tournament.js เติมเนื้อหาตามบทบาทและ URL:
         - ไม่มี ?tournamentId → รายการทัวนาเมนต์ที่ผ่านมา (ทุกบทบาท) + ฟอร์มสร้างทัวนาเมนต์ เลือกกี่คนก็ได้ (เฉพาะครู)
         - มี ?tournamentId=... → ผังทัวนาเมนต์ (นักเรียนอ่านอย่างเดียว · ครูมีปุ่มต่อสู้/เลือกผู้ชนะ) -->
    <div id="ที่วางหลัก"></div>
  </div>
</body>
</html>
