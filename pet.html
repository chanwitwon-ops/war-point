<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สัตว์เลี้ยงของฉัน · war-point</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/util.js" defer></script>
  <script src="js/firebase-config.js"></script>
  <script type="module" src="js/firebase.js"></script>
  <script src="js/nav.js" defer></script>
  <script src="js/auth-guard.js" defer></script>
  <script src="js/pet-config.js" defer></script>
  <script src="js/tournament-demo-data.js" defer></script>
  <script src="js/pet-data.js" defer></script>
  <script src="js/pet.js" defer></script>
</head>
<body>
  <div id="nav"></div>

  <div class="container">
    <h1>สัตว์เลี้ยงของฉัน</h1>
    <p class="subtitle">ใช้แต้มจากคะแนนสอบซื้อไข่ วิวัฒนาการ หรือเริ่มใหม่ได้</p>

    <div id="กล่องกำลังโหลด" class="card">
      <p>กำลังโหลด…</p>
    </div>

    <div id="กล่องไม่มีสิทธิ์" class="card hidden">
      <p>หน้านี้สำหรับนักเรียนเท่านั้น</p>
    </div>

    <div id="กล่องเตือนสัตว์เลี้ยง" class="alert alert-error hidden"></div>

    <!-- js/pet.js เติมเนื้อหาให้เฉพาะนักเรียนเท่านั้น (ครูจะไม่มีองค์ประกอบเหล่านี้ใน DOM) -->
    <div id="ที่วางสัตว์เลี้ยง" class="hidden"></div>
  </div>
</body>
</html>
