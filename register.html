<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สมัครสมาชิก · war-point</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/util.js" defer></script>
  <script src="js/firebase-config.js"></script>
  <script type="module" src="js/firebase.js"></script>
  <script src="js/register.js" defer></script>
</head>
<body>
  <div class="container" style="max-width:420px">
    <h1>🎮 war-point</h1>
    <p class="subtitle">สมัครสมาชิกใหม่ (เริ่มต้นเป็นบทบาทนักเรียนเสมอ)</p>

    <div class="card">
      <div id="ข้อความเตือน" class="alert alert-error hidden"></div>

      <form id="ฟอร์มสมัคร">
        <label for="name">ชื่อเล่น</label>
        <input type="text" id="name" placeholder="เช่น มดแดง (ห้ามใช้ชื่อจริง)">

        <label for="email">อีเมล</label>
        <input type="email" id="email" placeholder="เช่น somchai@example.com">

        <label for="password">รหัสผ่าน</label>
        <input type="password" id="password" placeholder="อย่างน้อย 6 ตัวอักษร">

        <div class="btn-row">
          <button type="submit" id="ปุ่มสมัคร" class="btn">สมัครสมาชิก</button>
        </div>
      </form>

      <p class="hint">มีบัญชีอยู่แล้ว? <a href="login.html">เข้าสู่ระบบ</a></p>
    </div>
  </div>
</body>
</html>
