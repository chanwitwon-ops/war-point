<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<title>combat-engine v2 self-test (scratch tool)</title>
<style>
  body { font-family: monospace; padding: 20px; background: #111; color: #ddd; }
  .pass { color: #7CFC00; }
  .fail { color: #FF5C5C; font-weight: bold; }
  #summary { font-size: 1.2em; margin-bottom: 16px; }
  pre { white-space: pre-wrap; background: #000; padding: 10px; }
</style>
</head>
<body>
<h1>combat-engine.js v2 — self test</h1>
<p>ตรวจสูตรที่ user ตั้งเองเมื่อ 2026-11-08 (สเปก 02 หัวข้อ ง.๓) — ไม่ใช่ prototype ตาม DESIGN.md</p>
<div id="summary"></div>
<pre id="log"></pre>

<script src="../../js/pet-config.js"></script>
<script src="../../js/combat-engine.js"></script>
<script>
(function () {
  var logEl = document.getElementById("log");
  var pass = 0, fail = 0;
  function log(ok, label, extra) {
    if (ok) pass++; else fail++;
    var div = document.createElement("div");
    div.className = ok ? "pass" : "fail";
    div.textContent = (ok ? "[PASS] " : "[FAIL] ") + label + (extra ? " — " + extra : "");
    logEl.appendChild(div);
    (ok ? console.log : console.error)(div.textContent);
  }

  function pixie(id, stage) {
    return { studentId: id, petName: id, species: "pixie", stats: window.PET_STAGE_STATS[stage] };
  }
  function custom(id, stats) { return { studentId: id, petName: id, species: "test", stats: stats }; }

  var KNOWN = ["match_start", "turn_start", "attack", "attack_missed", "attack_blocked", "damage_dealt", "ko", "turn_limit", "match_end"];

  // 1. determinism
  var r1 = window.คำนวณผลการต่อสู้({ matchId: "m-1", sideA: pixie("a", 4), sideB: pixie("b", 4) });
  var r2 = window.คำนวณผลการต่อสู้({ matchId: "m-1", sideA: pixie("a", 4), sideB: pixie("b", 4) });
  function ตัดเวลา(r) { var c = JSON.parse(JSON.stringify(r)); delete c.computed_at; return JSON.stringify(c); }
  log(ตัดเวลา(r1) === ตัดเวลา(r2), "matchId เดิมได้ผลเดิมทุก byte (ไม่นับ computed_at)");
  log(r1.engine_version === "2.0.0", "engine_version = 2.0.0");

  // 2. structure
  log(r1.events[0].type === "match_start" && r1.events[r1.events.length - 1].type === "match_end", "เริ่มด้วย match_start จบด้วย match_end");
  log(r1.events.every(function (e, i) { return e.seq === i; }), "seq ต่อเนื่องไม่ข้าม");
  var แปลก = r1.events.filter(function (e) { return KNOWN.indexOf(e.type) === -1; });
  log(แปลก.length === 0, "มีแต่ event ชนิดที่รู้จัก", แปลก.map(function (e) { return e.type; }).join(","));
  log(r1.sideA.hpPool === window.PET_STAGE_STATS[4].HP * 6, "HP pool = HP × 6", r1.sideA.hpPool);

  // 3. formula checks across many matches
  var ทุกแมตช์ = [];
  for (var i = 0; i < 200; i++) {
    ทุกแมตช์.push(window.คำนวณผลการต่อสู้({ matchId: "stress-" + i, sideA: pixie("a", i % 5), sideB: pixie("b", (i * 3) % 5) }));
  }
  var events = [].concat.apply([], ทุกแมตช์.map(function (m) { return m.events; }));
  var miss = events.filter(function (e) { return e.type === "attack_missed"; });
  var hitOk = miss.every(function (e) { return e.payload.hitChance >= 50 && e.payload.hitChance <= 95 && e.payload.roll > e.payload.hitChance; });
  log(miss.length > 0 && hitOk, "โอกาสโดนอยู่ใน 50–95% และพลาดเมื่อทอยเกิน", miss.length + " ครั้งที่พลาด");
  var block = events.filter(function (e) { return e.type === "attack_blocked"; });
  log(block.length > 0 && block.every(function (e) { return e.payload.blockChance <= 15 && e.payload.roll <= e.payload.blockChance; }), "บล็อก% ≤ 15 และบล็อกเมื่อทอยไม่เกิน", block.length + " ครั้ง");
  var dmg = events.filter(function (e) { return e.type === "damage_dealt"; });
  log(dmg.every(function (e) { return e.payload.amount >= 1 && e.payload.hpAfter >= 0 && (e.payload.hpBefore - e.payload.amount === e.payload.hpAfter || e.payload.hpAfter === 0); }),"ดาเมจ ≥ 1, HP ไม่ติดลบ, hpBefore − amount = hpAfter", dmg.length + " ครั้ง");
  log(ทุกแมตช์.every(function (m) { return m.result.turns <= 30; }), "ทุกแมตช์จบภายใน 30 เทิร์น");

  // 4. hit chance exact formula: ACC 40 vs EVA 60 → 60%
  var m4 = window.คำนวณผลการต่อสู้({ matchId: "acc", sideA: pixie("a", 4), sideB: pixie("b", 4) });
  var anyAttack = m4.events.filter(function (e) { return e.type === "attack_missed"; })[0];
  log(!anyAttack || anyAttack.payload.hitChance === 60, "Pixie ร่าง 4 ปะทะกัน: โอกาสโดน = 80 + (40 − 60) = 60%", anyAttack ? anyAttack.payload.hitChance : "ไม่มีพลาดในแมตช์นี้");

  // 5. damage formula range: ATK 35 vs DEF 20 → 35×100/120 = 29.17 ±10% → 26..32
  var d4 = m4.events.filter(function (e) { return e.type === "damage_dealt"; });
  log(d4.length > 0 && d4.every(function (e) { return e.payload.amount >= 26 && e.payload.amount <= 32; }), "ดาเมจ ATK35 vs DEF20 อยู่ในช่วง 26–32", d4.map(function (e) { return e.payload.amount; }).join(","));

  // 6. faster side always acts first
  var fast = custom("fast", { SPD: 90, ATK: 20, ACC: 50, EVA: 10, DEF: 10, HP: 50 });
  var slow = custom("slow", { SPD: 10, ATK: 20, ACC: 50, EVA: 10, DEF: 10, HP: 50 });
  var m6 = window.คำนวณผลการต่อสู้({ matchId: "spd", sideA: slow, sideB: fast });
  var starts = m6.events.filter(function (e) { return e.type === "turn_start"; });
  log(starts.every(function (e) { return e.payload.order[0] === "fast"; }), "ฝ่ายเร็วกว่ายิงก่อนทุกเทิร์น", starts.length + " เทิร์น");
  log(m6.events.filter(function (e) { return e.type === "attack"; }).every(function (e, i, arr) {
    return i === 0 || arr[i - 1].payload.actor !== e.payload.actor;
  }), "ผลัดกันยิงทีละฝ่าย ไม่มียิงซ้อน (ไม่มีกฎเร็ว 2 เท่าตี 2 ที)");

  // 7. turn cap + %HP decision: tanky + high EVA both sides
  var tank = custom("t1", { SPD: 50, ATK: 1, ACC: 1, EVA: 100, DEF: 100, HP: 100 });
  var tank2 = custom("t2", { SPD: 49, ATK: 1, ACC: 1, EVA: 100, DEF: 100, HP: 100 });
  var m7 = window.คำนวณผลการต่อสู้({ matchId: "cap", sideA: tank, sideB: tank2 });
  log(m7.result.turns === 30 && (m7.result.reason === "turn_limit" || m7.result.reason === "teacher_decides"), "ครบ 30 เทิร์นตัดสินด้วย %เลือด", m7.result.reason);
  log(m7.events.some(function (e) { return e.type === "turn_limit"; }), "มี event turn_limit");

  // 8. stage advantage: stage 4 beats egg in nearly every seed
  var ชนะ = 0;
  for (var j = 0; j < 50; j++) {
    var r = window.คำนวณผลการต่อสู้({ matchId: "adv-" + j, sideA: pixie("big", 4), sideB: pixie("egg", 0) });
    if (r.result.winner === "A") ชนะ++;
  }
  log(ชนะ >= 48, "ร่างสุดท้ายชนะไข่เกือบทุกครั้ง", ชนะ + "/50");

  // 9. fight length same stage ~12 turns
  var ยาว = [];
  for (var k = 0; k < 50; k++) ยาว.push(window.คำนวณผลการต่อสู้({ matchId: "len-" + k, sideA: pixie("a", 4), sideB: pixie("b", 4) }).result.turns);
  var เฉลี่ย = ยาว.reduce(function (s, x) { return s + x; }, 0) / ยาว.length;
  log(เฉลี่ย >= 8 && เฉลี่ย <= 18, "ร่างเดียวกันสู้กันเฉลี่ยราว 12 เทิร์น", เฉลี่ย.toFixed(1));

  // 10. no Math.random in engine source
  log(String(window.คำนวณผลการต่อสู้).indexOf("Math.random") === -1, "engine ไม่ใช้ Math.random()");

  document.getElementById("summary").innerHTML = "<b>" + pass + " passed</b> / " + (pass + fail) + " total" + (fail ? '<span class="fail"> — ' + fail + " FAILED</span>" : "");
  window.__TEST_SUMMARY__ = { pass: pass, fail: fail };
})();
</script>
</body>
</html>
