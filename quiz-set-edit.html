<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แก้ไขชุดข้อสอบ · war-point</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/util.js" defer></script>
  <script src="js/firebase-config.js"></script>
  <script type="module" src="js/firebase.js"></script>
  <script src="js/nav.js" defer></script>
  <script src="js/auth-guard.js" defer></script>
  <script src="js/quiz-set-edit.js" defer></script>
</head>
<body>
  <div id="nav"></div>

  <div class="container">
    <h1>แก้ไขชุดข้อสอบ</h1>
    <p class="subtitle">แก้ไขหรือลบชุดข้อสอบนี้ได้ — ชุดที่มีนักเรียนทำไปแล้ว การแก้ไขจะไม่กระทบคะแนนที่ตรวจไปแล้ว</p>

    <div id="กล่องกำลังโหลด" class="card">
      <p>กำลังโหลด…</p>
    </div>

    <div id="กล่องไม่มีสิทธิ์" class="card hidden">
      <p>หน้านี้สำหรับครูเท่านั้น</p>
    </div>

    <div id="กล่องไม่พบ" class="card hidden">
      <p id="ข้อความไม่พบ"></p>
      <div class="btn-row"><a class="btn-ghost" href="quiz-sets.html">← กลับไปรายการชุดข้อสอบ</a></div>
    </div>

    <div id="กล่องหลัก" class="hidden">
      <div class="card">
        <label for="ชื่อชุด">ชื่อชุดข้อสอบ</label>
        <input type="text" id="ชื่อชุด" placeholder="เช่น แบบทดสอบหน่วยที่ 3 — เศษส่วน">

        <label for="คะแนนเต็ม">คะแนนเต็ม</label>
        <input type="text" id="คะแนนเต็ม" placeholder="เช่น 50">

        <label for="จำนวนครั้ง">นักเรียนทำได้กี่ครั้ง (1–10 · นับคะแนนรอบดีที่สุด)</label>
        <input type="text" id="จำนวนครั้ง" inputmode="numeric" value="3">
      </div>

      <div id="กล่องคำถาม"></div>

      <div class="card">
        <div class="btn-row">
          <button type="button" class="btn-ghost" id="ปุ่มเพิ่มข้อเอง">+ เพิ่มข้อ</button>
          <button type="button" class="btn-ok" id="ปุ่มบันทึก">บันทึกการแก้ไข</button>
          <button type="button" class="btn-danger" id="ปุ่มลบ">ลบชุดข้อสอบนี้</button>
        </div>
        <div id="กล่องเตือนบันทึก" class="alert alert-error hidden"></div>
        <div id="กล่องสำเร็จ" class="alert alert-ai hidden"></div>
      </div>
    </div>
  </div>
</body>
</html>
